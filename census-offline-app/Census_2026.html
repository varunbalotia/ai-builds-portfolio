<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>घरेलू सर्वेक्षण प्रपत्र (Secure Offline)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px; font-size: 1.1em; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #004494; }
        .btn-export { background-color: #28a745; }
        .btn-danger { background-color: #dc3545; }
        .table-container { margin-top: 30px; overflow-x: auto; max-height: 400px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #0056b3; color: white; position: sticky; top: 0; }
        .secure-badge { text-align: center; color: #28a745; font-weight: bold; margin-bottom: 20px; padding: 10px; background: #e9f7ef; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>घरेलू सर्वेक्षण प्रपत्र</h2>
    <div class="secure-badge">🔒 100% Offline & Local (कोई इंटरनेट आवश्यक नहीं)</div>
    
    <form id="surveyForm"></form>
    
    <button type="button" onclick="saveRecord()">Save Entry (सेव करें)</button>
    <button type="button" class="btn-export" onclick="exportToExcel()">Download Master Excel (एक्सेल डाउनलोड करें)</button>
    <button type="button" class="btn-danger" onclick="clearData()">Clear All Data (सभी डेटा हटाएं)</button>
    
    <h3>Saved Entries Database (सुरक्षित प्रविष्टियां)</h3>
    <div class="table-container">
        <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const fields = [
        { id: "f1", label: "1. लाइन नंबर", type: "number" },
        { id: "f2", label: "2. भवन संख्या", type: "text" },
        { id: "f3", label: "3. जनगणना मकान संख्या", type: "text" },
        { id: "f4", label: "4. फर्श की सामग्री", type: "select", options: ["मिट्टी", "लकड़ी", "ईंट", "पत्थर", "सीमेंट", "टाइल", "अन्य"] },
        { id: "f5", label: "5. दीवार की सामग्री", type: "select", options: ["प्लास्टिक", "मिट्टी", "घास/फूस", "लकड़ी", "पत्थर", "गारे के साथ पत्थर", "ईंट", "कंक्रीट", "धातु चादर", "अन्य"] },
        { id: "f6", label: "6. छत की सामग्री", type: "select", options: ["घास", "प्लास्टिक", "टाइल", "ईंट", "पत्थर", "स्लेट", "कंक्रीट", "धातु चादर", "अन्य"] },
        { id: "f7", label: "7. मकान का उपयोग", type: "select", options: ["आवास", "आवास + अन्य", "स्कूल/कॉलेज", "होटल", "अस्पताल", "फैक्ट्री", "पूजा स्थल", "अन्य गैर-आवासीय", "खाली"] },
        { id: "f8", label: "8. मकान की स्थिति", type: "select", options: ["अच्छी", "रहने योग्य", "जर्जर / खराब"] },
        { id: "f9", label: "9. परिवार संख्या", type: "number" },
        { id: "f10", label: "10. कुल निवासियों की संख्या", type: "number" },
        { id: "f11", label: "11. परिवार के मुखिया का नाम", type: "text" },
        { id: "f12", label: "12. मुखिया का लिंग", type: "select", options: ["पुरुष", "महिला", "ट्रांसजेंडर"] },
        { id: "f13", label: "13. जाति श्रेणी", type: "select", options: ["अ.जा. (SC)", "अ.ज.जा. (ST)", "अन्य"] },
        { id: "f14", label: "14. स्वामित्व की स्थिति", type: "select", options: ["स्वयं का", "किराए का (अन्यत्र घर है)", "किराए का (अपना घर नहीं)", "अन्य"] },
        { id: "f15", label: "15. रहने के कमरों की संख्या", type: "number" },
        { id: "f16", label: "16. विवाहित जोड़ों की संख्या", type: "number" },
        { id: "f17", label: "17. पेयजल का मुख्य स्रोत", type: "select", options: ["नल (उपचारित)", "नल (अनुपचारित)", "बोरहोल", "बोतलबंद"] },
        { id: "f18", label: "18. जल की उपलब्धता", type: "select", options: ["परिसर में", "परिसर के पास", "दूर"] },
        { id: "f19", label: "19. रोशनी का स्रोत", type: "select", options: ["बिजली", "सौर ऊर्जा"] },
        { id: "f20", label: "20. शौचालय तक पहुँच", type: "select", options: ["केवल परिवार", "साझा", "सार्वजनिक", "खुला"] },
        { id: "f21", label: "21. शौचालय का प्रकार", type: "select", options: ["पाइप सीवर", "सेप्टिक टैंक", "स्लैब वाला गड्डा", "बिना स्लैब"] },
        { id: "f22", label: "22. अपशिष्ट जल निकासी", type: "select", options: ["बंद नाली", "खुली नाली", "कोई नहीं"] },
        { id: "f23", label: "23. स्नान की सुविधा", type: "select", options: ["स्नानघर", "बिना छत की जगह", "नहीं"] },
        { id: "f24", label: "24. रसोई की उपलब्धता", type: "select", options: ["रसोई (LPG/PNG के साथ)", "रसोई नहीं", "खाना नहीं बनाना"] },
        { id: "f25", label: "25. खाना पकाने का ईंधन", type: "select", options: ["लकड़ी", "LPG/PNG", "बिजली", "सौर", "अन्य"] },
        { id: "f26", label: "26. रेडियो", type: "select", options: ["रेडियो सेट", "मोबाइल", "अन्य"] },
        { id: "f27", label: "27. टेलीविजन", type: "select", options: ["दूरदर्शन", "DTH", "केबल", "अन्य"] },
        { id: "f28", label: "28. इंटरनेट", type: "select", options: ["लैपटॉप", "मोबाइल", "अन्य", "उपयोग नहीं"] },
        { id: "f29", label: "29. लैपटॉप/कंप्यूटर", type: "select", options: ["हाँ", "नहीं"] },
        { id: "f30", label: "30. लैंडलाइन/मोबाइल", type: "select", options: ["लैंडलाइन", "मोबाइल", "दोनों", "नहीं"] },
        { id: "f31", label: "31. दुपहिया वाहन", type: "select", options: ["साइकिल", "बाइक/स्कूटी", "दोनों"] },
        { id: "f32", label: "32. चौपहिया वाहन", type: "select", options: ["कार", "जीप", "वैन", "नहीं"] },
        { id: "f33", label: "33. मुख्य अनाज", type: "select", options: ["चावल", "गेहूं", "बाजरा", "मक्का", "अन्य"] },
        { id: "f34", label: "34. मोबाइल नंबर", type: "text" }
    ];

    let surveyData = JSON.parse(localStorage.getItem("secureCensusData")) || [];

    // Initialize Form
    const formElement = document.getElementById("surveyForm");
    fields.forEach(field => {
        const div = document.createElement("div");
        div.className = "form-group";
        const label = document.createElement("label");
        label.textContent = field.label;
        div.appendChild(label);

        if (field.type === "select") {
            const select = document.createElement("select");
            select.id = field.id;
            select.innerHTML = '<option value="">-- चयन करें (Select) --</option>';
            field.options.forEach(opt => select.innerHTML += `<option value="${opt}">${opt}</option>`);
            div.appendChild(select);
        } else {
            const input = document.createElement("input");
            input.type = field.type;
            input.id = field.id;
            div.appendChild(input);
        }
        formElement.appendChild(div);
    });

    // Build Table Headers
    const thead = document.getElementById("tableHead");
    let headerRow = "<tr>";
    fields.forEach(f => headerRow += `<th>${f.label}</th>`);
    headerRow += "</tr>";
    thead.innerHTML = headerRow;

    // Render Table Data
    function renderTable() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        surveyData.forEach(row => {
            let tr = document.createElement("tr");
            fields.forEach(f => {
                let td = document.createElement("td");
                td.textContent = row[f.label] || "";
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }
    renderTable();

    // Save Record locally
    function saveRecord() {
        const record = {};
        let isValid = true;
        fields.forEach(field => {
            const val = document.getElementById(field.id).value.trim();
            record[field.label] = val;
            if(field.id === "f1" && !val) isValid = false; 
        });

        if (!isValid) return alert("कृपया लाइन नंबर दर्ज करें। (Enter Line Number)");

        surveyData.push(record);
        localStorage.setItem("secureCensusData", JSON.stringify(surveyData));
        
        renderTable();
        document.getElementById("surveyForm").reset();
        window.scrollTo(0, 0);
        alert("✅ Data Saved Securely Offline!");
    }

    // Export to Excel (CSV)
    function exportToExcel() {
        if (surveyData.length === 0) return alert("No data to export!");

        let csvContent = "\uFEFF" + fields.map(f => `"${f.label}"`).join(",") + "\n";
        surveyData.forEach(row => {
            csvContent += fields.map(f => `"${(row[f.label] || "").replace(/"/g, '""')}"`).join(",") + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Census_Master_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Clear Memory
    function clearData() {
        if(confirm("चेतावनी (Warning): Have you downloaded the Excel file? This will permanently delete local data!")) {
            surveyData = [];
            localStorage.removeItem("secureCensusData");
            renderTable();
        }
    }
</script>

</body>
</html>
